name: PR Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  review:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 MCP Server 依赖
        working-directory: production/src/mcp-server
        run: npm ci

      - name: 编译 MCP Server
        working-directory: production/src/mcp-server
        run: |
          rm -rf dist
          npm run build

      - name: 安装 Orchestrator 依赖
        working-directory: production/src/orchestrator
        run: npm ci

      - name: 运行 PR 评审
        working-directory: production/src/orchestrator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RULES_DIR: ${{ github.workspace }}/production/data/team-rules
        run: |
          set -o pipefail
          npx tsx index.ts ${{ github.event.pull_request.number }} 2>&1 | tee ci-output.log

      - name: 贴评审报告
        id: post-report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const reportPath = `${process.env.GITHUB_WORKSPACE}/production/src/orchestrator/report.md`;
            const logPath = `${process.env.GITHUB_WORKSPACE}/production/src/orchestrator/ci-output.log`;

            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, "utf-8");
              const truncated = body.length > 64000 ? body.slice(0, 64000) + "\n\n...报告过长，已截断" : body;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: truncated,
              });
              console.log("评审报告已贴到 PR 评论区");
            } else if (fs.existsSync(logPath)) {
              const log = fs.readFileSync(logPath, "utf-8").slice(-2000);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "## 评审失败\n\n```\n" + log + "\n```",
              });
              console.log("失败日志已贴到 PR 评论区");
            } else {
              console.log("未找到报告或日志文件，跳过");
            }

      - name: 提交 rejected 记录到仓库
        if: always()
        run: |
          if [ -d "rejected" ] && [ "$(ls -A rejected 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add rejected/
            git add production/data/review-records.json
            git diff --cached --quiet || git commit -m "Add rejected record for PR #${{ github.event.pull_request.number }}"
            git push
            echo "rejected 记录已提交到仓库"
          else
            echo "无 rejected 文件，跳过"
          fi

  override:
    if: github.event.action == 'labeled' && github.event.label.name == 'override'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Orchestrator 依赖
        working-directory: production/src/orchestrator
        run: npm ci

      - name: 执行推翻
        working-directory: production/src/orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          npx tsx override.ts ${{ github.event.pull_request.number }} 2>&1

      - name: 提交推翻记录
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add production/data/review-records.json
          # rejected/ 文件已删除，可能触发删除提交
          if [ -d "rejected" ] && [ "$(ls -A rejected 2>/dev/null)" ]; then
            git add rejected/
          fi
          git diff --cached --quiet || git commit -m "Override PR #${{ github.event.pull_request.number }} 的打回判定"
          git pull --rebase
          git push
          echo "推翻记录已提交"

      - name: 贴评论确认
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "## ✅ 已接受人工推翻\n\n机器人对此 PR 的打回判定已被 `override` 标签推翻，评审记录已标记为 `humanOverridden=true`。",
            });
