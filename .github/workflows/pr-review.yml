name: PR Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  review:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 MCP Server 依赖
        working-directory: production/src/mcp-server
        run: npm ci

      - name: 编译 MCP Server
        working-directory: production/src/mcp-server
        run: |
          rm -rf dist
          npm run build

      - name: 安装 Orchestrator 依赖
        working-directory: production/src/orchestrator
        run: npm ci

      - name: 安装 Agent 编排依赖
        working-directory: exploration/agent-orchestrator
        run: npm ci

      - name: 锁定 PR 创建时刻的规则版本
        id: rules-snapshot
        run: |
          # 拿 PR 创建时间
          CREATED_AT=$(gh pr view ${{ github.event.pull_request.number }} --json createdAt --jq .createdAt)
          # 找该时刻前规则文件最后一次变更的 commit
          RULES_SHA=$(git log -1 --format=%H --before="$CREATED_AT" -- production/data/team-rules 2>/dev/null || echo "")
          if [ -n "$RULES_SHA" ]; then
            # 检出创建时刻的规则快照
            RULES_DIR=/tmp/rules-snapshot
            mkdir -p "$RULES_DIR"
            for f in RULE-API.md RULE-ARCH.md RULE-DEPS.md RULE-SCOPE.md RULE-SECURITY.md RULE-TEST.md; do
              git show "$RULES_SHA:production/data/team-rules/$f" > "$RULES_DIR/$f" 2>/dev/null || true
            done
            echo "RULES_DIR=$RULES_DIR"
            echo "rules_dir=$RULES_DIR" >> "$GITHUB_OUTPUT"
            echo "使用 PR 创建时刻规则快照: $RULES_SHA"
          else
            echo "未找到历史规则版本，使用当前规则"
            echo "rules_dir=${{ github.workspace }}/production/data/team-rules" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 运行 PR 评审
        timeout-minutes: 25
        working-directory: exploration/agent-orchestrator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RULES_DIR: ${{ steps.rules-snapshot.outputs.rules_dir }}
        run: |
          set -o pipefail
          npx tsx index.ts ${{ github.event.pull_request.number }} 2>&1 | tee ci-output.log

      - name: 贴评审报告
        id: post-report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const reportPath = `${process.env.GITHUB_WORKSPACE}/exploration/agent-orchestrator/report.md`;
            const logPath = `${process.env.GITHUB_WORKSPACE}/exploration/agent-orchestrator/ci-output.log`;

            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, "utf-8");
              const truncated = body.length > 64000 ? body.slice(0, 64000) + "\n\n...报告过长，已截断" : body;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: truncated,
              });
              console.log("评审报告已贴到 PR 评论区");
            } else if (fs.existsSync(logPath)) {
              const log = fs.readFileSync(logPath, "utf-8").slice(-2000);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "## 评审失败\n\n```\n" + log + "\n```",
              });
              console.log("失败日志已贴到 PR 评论区");
            } else {
              console.log("未找到报告或日志文件，跳过");
            }

      - name: 提交评审产物到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # git add 后检查是否有任何暂存内容（含新增 untracked 文件），避免"Everything up-to-date"漏提交
          git add -A production/data/review-records.json rejected/ misrate-alert.txt 2>/dev/null || true
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "Add review artifacts for PR #${{ github.event.pull_request.number }}"
            git pull --rebase || true
            git push
            echo "评审产物已提交到仓库"
          else
            echo "无评审产物变更，跳过提交"
          fi

  override:
    if: github.event.action == 'labeled' && github.event.label.name == 'override'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Orchestrator 依赖
        working-directory: production/src/orchestrator
        run: npm ci

      - name: 执行推翻
        working-directory: production/src/orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          npx tsx override.ts ${{ github.event.pull_request.number }} 2>&1

      - name: 提交推翻记录
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add production/data/review-records.json
          if [ -d "rejected" ] && [ "$(ls -A rejected 2>/dev/null)" ]; then
            git add rejected/
          fi
          git diff --cached --quiet || git commit -m "Override PR #${{ github.event.pull_request.number }} 的打回判定"
          git pull --rebase
          git push
          echo "推翻记录已提交"

      - name: 贴评论确认
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "## ✅ 已接受人工推翻\n\n机器人对此 PR 的打回判定已被 `override` 标签推翻，评审记录已标记为 `humanOverridden=true`。",
            });
