name: PR Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 MCP Server 依赖
        working-directory: production/src/mcp-server
        run: npm ci

      - name: 编译 MCP Server
        working-directory: production/src/mcp-server
        run: |
          rm -rf dist
          npm run build

      - name: 安装 Orchestrator 依赖
        working-directory: production/src/orchestrator
        run: npm ci

      - name: 运行 PR 评审
        working-directory: production/src/orchestrator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RULES_DIR: ${{ github.workspace }}/production/data/team-rules
        run: |
          set -o pipefail
          npx tsx index.ts ${{ github.event.pull_request.number }} 2>&1 | tee ci-output.log

      - name: 贴评审报告
        id: post-report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const reportPath = `${process.env.GITHUB_WORKSPACE}/production/src/orchestrator/report.md`;
            const logPath = `${process.env.GITHUB_WORKSPACE}/production/src/orchestrator/ci-output.log`;

            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, "utf-8");
              const truncated = body.length > 64000 ? body.slice(0, 64000) + "\n\n...报告过长，已截断" : body;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: truncated,
              });
              console.log("评审报告已贴到 PR 评论区");
            } else if (fs.existsSync(logPath)) {
              const log = fs.readFileSync(logPath, "utf-8").slice(-2000);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "## 评审失败\n\n```\n" + log + "\n```",
              });
              console.log("失败日志已贴到 PR 评论区");
            } else {
              console.log("未找到报告或日志文件，跳过");
            }

      - name: 提交评审产物到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "rejected" ] && [ "$(ls -A rejected 2>/dev/null)" ]; then
            git add rejected/
          fi
          git add production/data/review-records.json production/data/dual-model-records.json
          if [ -d "multi-model-log" ] && [ "$(ls -A multi-model-log 2>/dev/null)" ]; then
            git add multi-model-log/
          fi
          git diff --cached --quiet || git commit -m "Add review artifacts for PR #${{ github.event.pull_request.number }}"
          git push
          echo "评审产物已提交到仓库"
