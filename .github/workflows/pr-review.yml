name: PR Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 MCP Server 依赖
        working-directory: production/src/mcp-server
        run: npm ci

      - name: 编译 MCP Server
        working-directory: production/src/mcp-server
        run: npm run build

      - name: 安装 Orchestrator 依赖
        working-directory: production/src/orchestrator
        run: npm ci

      - name: 运行 PR 评审
        working-directory: production/src/orchestrator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: npx tsx index.ts ${{ github.event.pull_request.number }}

      - name: 贴评审报告
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // 评审报告由 orchestrator 输出到 stdout，此处读取并贴回 PR
            // 实际 CI 中需要把报告写文件再读取
            console.log("评审完成，报告已输出到日志");
